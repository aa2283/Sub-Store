name: Sub-Store 终极自动化同步 API_URL 最终版

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时运行一次

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0
          
      

      - name: 2. 启动服务
        run: |
          # 建立一个空目录，不放 sub-store.json，防止启动冲突
          mkdir -p sub-store-nodes
          docker run -d --name substore-svc \
            -v $(pwd)/sub-store-nodes:/root/sub-store-data \
            -p 3000:3000 -p 3001:3001 xream/sub-store
          echo "⏳ 等待容器初始化..."
          sleep 20

      - name: 3. 开启隧道并提取链接
        run: |
          # 1. 下载并准备
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          # 2. 启动隧道：去掉 --logfile，改用标准重定向
          # 这样 cloudflared 的所有实时输出都会进入 backend.log
          nohup ./cloudflared tunnel --url http://127.0.0.1:3000 > backend.log 2>&1 &
          
          echo "🔄 正在申请隧道域名 (预计 10-30 秒)..."
          
          # 3. 循环提取域名
          API_URL=""
          for i in {1..15}; do
            # 兼容更多字符情况的正则
            API_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' backend.log | head -n 1)
            if [ -n "$API_URL" ]; then
              echo "✅ 成功获取域名！"
              echo "::add-mask::$API_URL"
              break
            fi
            echo "等待中 ($i/15)..."
            sleep 3
          done

          # 4. 失败处理：如果没提取到，打印日志内容用于排查
          if [ -z "$API_URL" ]; then 
            echo "❌ 提取链接失败！以下是 backend.log 的最后内容："
            tail -n 20 backend.log
            exit 1 
          fi
          
          # 5. 存入环境变量
          echo "FINAL_API_URL=$API_URL" >> $GITHUB_ENV
          
          # ================== 域名同步模块开始 (建议插入在监听循环之前) ==================
          
      - name: 4. 域名同步至 Cloudflare KV
        env:
          KV_KEY: "URL_3000" 
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "${{ env.FINAL_API_URL }}" ]; then
            echo "❌ FINAL_API_URL 为空，跳过同步"
            exit 1
          fi

          echo "🚀 正在同步域名到 Cloudflare KV, Key: ${{ env.KV_KEY }}"
          
          # 执行 PUT 请求
          RESPONSE=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_ID/values/${{ env.KV_KEY }}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: text/plain" \
            --data "${{ env.FINAL_API_URL }}")

          # 【关键修复】使用正则兼容有无空格的情况，并打印原始响应方便排查
          echo "📡 原始响应: $RESPONSE"
          
          if echo "$RESPONSE" | grep -Ei '"success"\s*:\s*true' > /dev/null; then
            echo "✅ KV 同步成功！"
          else
            echo "❌ KV 同步失败，请检查 Token 权限或 ID 是否正确。"
            exit 1
          fi
      # ================== 域名同步模块结束 ==================

      - name: 5. 哨兵监听与主动注入
        env:
          MY_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          ROOT_DIR=$(pwd)
          DATA_DIR="$ROOT_DIR/sub-store-nodes"
          SUBS_DIR="$ROOT_DIR/subs"
          mkdir -p "$SUBS_DIR"

          # 1. 此时从备份仓库拉取真正的数据到 snapshot.json
          git clone --depth 1 https://x-access-token:${MY_TOKEN}@github.com/aa2283/v2ray_configs.git backup_repo
          cp -f backup_repo/sub-store-nodes/sub-store.json "$ROOT_DIR/snapshot.json"
          echo "📸 备份数据已就绪：$(stat -c%s $ROOT_DIR/snapshot.json) 字节"

          # 2. 哨兵循环
          for i in {1..15}; do
            echo ">>> 第 $i 次巡检 <<<"
            
            # 1. 安全地从容器提取内容
            # 使用 || echo '' 确保即使命令失败，变量也是空的而不是让脚本崩溃
            CONTAINER_JSON_CONTENT=$(docker exec substore-svc cat /root/sub-store-data/sub-store.json 2>/dev/null || echo "")
            
            # 2. 安全检查：只有内容不为空时才交给 jq
            SUB_COUNT=0
            if [ -n "$CONTAINER_JSON_CONTENT" ]; then
                # 即使 jq 解析失败，也强制输出 0 而不崩溃
                SUB_COUNT=$(echo "$CONTAINER_JSON_CONTENT" | jq '.subscribes | length' 2>/dev/null || echo "0")
            fi
            
            if [ "$SUB_COUNT" -gt 0 ]; then
                echo "✅ 注入验证成功！容器内已存在 $SUB_COUNT 个订阅"
                
                # 物理同步到宿主机挂载点，确保后续 curl 抓取有效
                echo "$CONTAINER_JSON_CONTENT" > "$DATA_DIR/sub-store.json"
                
                # 执行你的同步推送函数
                if [ "$i" -eq 1 ] || ! diff -q "$DATA_DIR/sub-store.json" "$ROOT_DIR/snapshot.json" >/dev/null 2>&1; then
                    do_sync_push
                    cp -f "$DATA_DIR/sub-store.json" "$ROOT_DIR/snapshot.json"
                fi
            else
                echo "🚨 容器数据持久化失败 (当前: $SUB_COUNT)，启动『断电注入』程序..."
                
                if [ -s "$ROOT_DIR/snapshot.json" ]; then
                   # 1. 强制断电：杀掉容器，防止它在后台搞破坏
                   docker stop substore-svc || true
                   
                   # 2. 物理锁定：在宿主机修改挂载点文件
                   cat "$ROOT_DIR/snapshot.json" > "$DATA_DIR/sub-store.json"
                   sudo chmod 777 "$DATA_DIR/sub-store.json"
                   echo "💾 磁盘文件已强制锁定 (大小: $(stat -c%s $DATA_DIR/sub-store.json) 字节)"
                   
                   # 3. 重新通电：启动容器
                   docker start substore-svc
                   
                   # 4. 强制唤醒：给后端一个指令，让它必须去读磁盘
                   echo "🚀 正在冷重启动容器..."
                   sleep 20
                   curl -s -X POST "http://127.0.0.1:3000/api/utils/sync" > /dev/null || true
                   
                   echo "💉 冷注入指令已下达，观察下一轮巡检..."
                else
                   echo "❌ 错误：snapshot.json 丢失！"
                fi
            fi
