name: Sub-Store 终极自动化同步 API_URL 最终2

on:
  workflow_dispatch: # 保留手动启动按钮，方便随时调试
  schedule:
    # 这里的 cron 表达式：分钟 小时 日 月 周 (UTC 时间)
    # 北京时间 08:00 = UTC 00:00
    # - cron: '0 0 * * *'
    
    # 如果你想每 6 小时自动开机加工一次（北京时间 00:00, 06:00, 12:00, 18:00）
     - cron: '0 */6 * * *'

# ... 后面接你之前的 jobs 部分 ...

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0
          
      - name: 1-2. 同名恢复备份 (aa2283 专用版)
        env:
          MY_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          # 建立同名本地虚拟目录
          mkdir -p sub-store-nodes
          sudo chmod -R 777 sub-store-nodes
          echo "🔐 权限已强力开启"
          
          echo "📥 拉取 aa2283/v2ray_configs..."
          git clone --depth 1 https://x-access-token:${MY_TOKEN}@github.com/aa2283/v2ray_configs.git backup_repo
          
          # 1:1 路径提取
          if [ -f "backup_repo/sub-store-nodes/sub-store.json" ]; then
              cp -f backup_repo/sub-store-nodes/sub-store.json sub-store-nodes/sub-store.json
              echo "✅ 已将仓库中的 sub-store-nodes 配置同步到本地虚拟目录"
          else
              echo "❌ 失败：仓库 sub-store-nodes 目录下未发现 sub-store.json"
              exit 1
          fi

      - name: 2. 启动服务 (挂载持久化配置)
        run: |
          docker run -d --name substore-svc \
            -e "SUB_STORE_FRONTEND_BACKEND_PATH=/ASSET_URL" \
            -v $(pwd)/sub-store-nodes:/opt/sub-store/data \
            -p 3000:3000 -p 3001:3001 xream/sub-store
          sleep 20 # 给容器充足的启动和写盘时间

      - name: 3. 开启隧道并提取链接
        run: |
          # 1. 下载并准备
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          # 2. 启动隧道：去掉 --logfile，改用标准重定向
          # 这样 cloudflared 的所有实时输出都会进入 backend.log
          nohup ./cloudflared tunnel --url http://127.0.0.1:3000 > backend.log 2>&1 &
          
          echo "🔄 正在申请隧道域名 (预计 10-30 秒)..."
          
          # 3. 循环提取域名
          API_URL=""
          for i in {1..15}; do
            # 兼容更多字符情况的正则
            API_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' backend.log | head -n 1)
            if [ -n "$API_URL" ]; then
              echo "✅ 成功获取域名！"
              echo "::add-mask::$API_URL"
              break
            fi
            echo "等待中 ($i/15)..."
            sleep 3
          done

          # 4. 失败处理：如果没提取到，打印日志内容用于排查
          if [ -z "$API_URL" ]; then 
            echo "❌ 提取链接失败！以下是 backend.log 的最后内容："
            tail -n 20 backend.log
            exit 1 
          fi
          
          # 5. 存入环境变量
          echo "FINAL_API_URL=$API_URL" >> $GITHUB_ENV
          
          # ================== 域名同步模块开始 (建议插入在监听循环之前) ==================
          
      - name: 4. 域名同步至 Cloudflare KV
        env:
          KV_KEY: "URL_3000" 
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "${{ env.FINAL_API_URL }}" ]; then
            echo "❌ FINAL_API_URL 为空，跳过同步"
            exit 1
          fi

          echo "🚀 正在同步域名到 Cloudflare KV, Key: ${{ env.KV_KEY }}"
          
          # 执行 PUT 请求
          RESPONSE=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_ID/values/${{ env.KV_KEY }}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: text/plain" \
            --data "${{ env.FINAL_API_URL }}")

          # 【关键修复】使用正则兼容有无空格的情况，并打印原始响应方便排查
          echo "📡 原始响应: $RESPONSE"
          
          if echo "$RESPONSE" | grep -Ei '"success"\s*:\s*true' > /dev/null; then
            echo "✅ KV 同步成功！"
          else
            echo "❌ KV 同步失败，请检查 Token 权限或 ID 是否正确。"
            exit 1
          fi
      # ================== 域名同步模块结束 ==================
          
      - name: 5. 精准监听下载链接并实时推送
        env:
          MY_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          # 1. 初始化路径
          ROOT_DIR=$(pwd)
          DATA_DIR="$ROOT_DIR/sub-store-nodes" 
          SUBS_DIR="$ROOT_DIR/subs"            # <--- 必须加上这一行
          REPO_DIR="$ROOT_DIR/target_repo"
          mkdir -p "$SUBS_DIR"                 # <--- 必须加上这一行

          # 2. 建立初始快照（防止重复推送的关键）
          [ -f "$DATA_DIR/sub-store.json" ] && cp -f "$DATA_DIR/sub-store.json" "$ROOT_DIR/snapshot.json" || touch "$ROOT_DIR/snapshot.json"

          # 3. 解析订阅变量
          local_list="${{ vars.SUB_LIST }}"
          readarray -t LINES <<< "$(echo "$local_list" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          # 定义核心同步函数
          do_sync_push() {
            echo "📢 [$(date +'%H:%M:%S')] 检测到有效变动，启动同步程序..."
            HAS_REAL_UPDATE=false
            
            for line in "${LINES[@]}"; do
              [[ -z "$line" ]] && continue
              NAME="${line%%:*}"
              FORMATS_STR="${line#*:}"
              IFS='|' read -ra FORMATS <<< "$FORMATS_STR"
              
              for fmt in "${FORMATS[@]}"; do
                fmt=$(echo "$fmt" | tr -d '[:space:]')
                case $fmt in
                  yaml) TARGET="ClashMeta" ;;
                  json) TARGET="Sing-Box" ;;
                  txt)  TARGET="URI" ;;
                  *)    TARGET="$fmt" ;;
                esac
                
                FILE_PATH="$SUBS_DIR/$NAME.$fmt"
                OLD_PATH="$SUBS_DIR/old_$NAME.$fmt"
                
                # 执行抓取
                curl -s "http://127.0.0.1:3000/download/$NAME?target=$TARGET" -o "$FILE_PATH"
                
                # --- 参考新脚本：增加“政审”逻辑 ---
                VALID=false
                if [ -s "$FILE_PATH" ] && [ $(stat -c%s "$FILE_PATH") -gt 100 ]; then
                  if [[ "$fmt" == "json" ]] && jq -e . "$FILE_PATH" >/dev/null 2>&1; then VALID=true; fi
                  if [[ "$fmt" == "yaml" ]] && grep -q "proxies:" "$FILE_PATH"; then VALID=true; fi
                  if [[ "$fmt" == "txt" ]] && grep -qE "(vmess|ss|vless)://" "$FILE_PATH"; then VALID=true; fi
                fi

                if [ "$VALID" = true ]; then
                  if [ ! -f "$OLD_PATH" ] || ! cmp -s "$FILE_PATH" "$OLD_PATH"; then
                    echo "✅ 捕获变动: $NAME.$fmt"
                    cp -f "$FILE_PATH" "$OLD_PATH"
                    HAS_REAL_UPDATE=true
                  fi
                else
                  rm -f "$FILE_PATH" # 剔除无效报错文件
                fi
              done
            done

            if [ "$HAS_REAL_UPDATE" = true ]; then
              rm -rf "$REPO_DIR"
              if git clone https://oauth2:${{ secrets.MY_PAT }}@github.com/aa2283/v2ray_configs.git "$REPO_DIR"; then
                DEST_PATH="$REPO_DIR/sub-store-nodes"
                mkdir -p "$DEST_PATH"
                # 清理并写入
                find "$DEST_PATH" -type f \( -name "*.yaml" -o -name "*.txt" -o -name "*.json" \) ! -name "sub-store.json" -delete
                find "$SUBS_DIR" -maxdepth 1 -type f ! -name "old_*" -exec cp -f {} "$DEST_PATH/" \;
                # 备份 JSON
                cp -f "$DATA_DIR/sub-store.json" "$DEST_PATH/sub-store.json"
                
                (
                  cd "$REPO_DIR"
                  git config --local user.email "bot@github.com"
                  git config --local user.name "AutoBot"
                  git add .
                  if ! git diff --cached --quiet; then
                    git commit -m "🔖 自动同步: $(date +'%H:%M:%S')"
                    git push origin main && echo "🚀 仓库更新成功"
                  fi
                )
                rm -rf "$REPO_DIR"
              fi
              # 更新快照，防止死循环
              cp -f "$DATA_DIR/sub-store.json" "$ROOT_DIR/snapshot.json"
            fi
          }

          # 4. 进入循环哨兵模式
          for i in {1..15}; do
            echo ">>> 第 $i 次巡检 <<<"
            
            # --- 关键防护：检查 sub-store.json 是否被“洗”成了空配置 ---
            # 判断标准：文件必须存在，且大小必须大于你仓库备份的大小（或者给个保底值，如 500 字节）
            if [ -s "$DATA_DIR/sub-store.json" ] && [ $(stat -c%s "$DATA_DIR/sub-store.json") -gt 300 ]; then
                
                # 只有当【真的有变动】且【不是空配置】时才同步
                if ! diff -q "$DATA_DIR/sub-store.json" "$ROOT_DIR/snapshot.json" >/dev/null 2>&1 || [ "$i" -eq 1 ]; then
                   # 再次利用 jq 确保它不是个只有 {} 的空壳
                   if jq -e '.subscribes | length > 0' "$DATA_DIR/sub-store.json" >/dev/null 2>&1; then
                     do_sync_push
                   else
                     echo "⚠️ 警告：检测到 sub-store.json 订阅列表为空，可能是容器重置，拒绝执行同步！"
                   fi
                fi
            else
                echo "❌ 严重错误：sub-store.json 丢失或已损坏，尝试从快照恢复..."
                cp -f "$ROOT_DIR/snapshot.json" "$DATA_DIR/sub-store.json" || true
            fi
            
            sleep 60
          done
