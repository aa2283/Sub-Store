name: Sub-Store 终极自动化同步 API_URL 最终版

on:
  workflow_dispatch: 
  schedule:
    #- cron: '0 */6 * * *' # 每 6 小时运行一次

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0
          
      

      - name: 2. 启动服务 (路径对齐版)
        run: |
          mkdir -p sub-store-nodes
          # 1. 挂载路径对齐到 /opt/app/data
          # 2. 端口对齐: 3000 为后端，3001 为前端
          # 3. 环境变量对齐混淆路径
          docker run -d --name substore-svc \
            -v $(pwd)/sub-store-nodes:/opt/app/data \
            -p 3000:3000 -p 3001:3001 xream/sub-store
          echo "⏳ 等待容器初始化..."
          sleep 20

      - name: 3. 开启隧道并提取链接
        run: |
          # 1. 下载并准备
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          # 2. 启动隧道：去掉 --logfile，改用标准重定向
          # 这样 cloudflared 的所有实时输出都会进入 backend.log
          nohup ./cloudflared tunnel --url http://127.0.0.1:3000 > backend.log 2>&1 &
          
          echo "🔄 正在申请隧道域名 (预计 10-30 秒)..."
          
          # 3. 循环提取域名
          API_URL=""
          for i in {1..15}; do
            # 兼容更多字符情况的正则
            API_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' backend.log | head -n 1)
            if [ -n "$API_URL" ]; then
              echo "✅ 成功获取域名！"
              echo "::add-mask::$API_URL"
              break
            fi
            echo "等待中 ($i/15)..."
            sleep 3
          done

          # 4. 失败处理：如果没提取到，打印日志内容用于排查
          if [ -z "$API_URL" ]; then 
            echo "❌ 提取链接失败！以下是 backend.log 的最后内容："
            tail -n 20 backend.log
            exit 1 
          fi
          
          # 5. 存入环境变量
          echo "FINAL_API_URL=$API_URL" >> $GITHUB_ENV
          
          # ================== 域名同步模块开始 (建议插入在监听循环之前) ==================
          
      - name: 4. 域名同步至 Cloudflare KV
        env:
          KV_KEY: "URL_3000" 
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "${{ env.FINAL_API_URL }}" ]; then
            echo "❌ FINAL_API_URL 为空，跳过同步"
            exit 1
          fi

          echo "🚀 正在同步域名到 Cloudflare KV, Key: ${{ env.KV_KEY }}"
          
          # 执行 PUT 请求
          RESPONSE=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_ID/values/${{ env.KV_KEY }}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: text/plain" \
            --data "${{ env.FINAL_API_URL }}")

          # 【关键修复】使用正则兼容有无空格的情况，并打印原始响应方便排查
          echo "📡 原始响应: $RESPONSE"
          
          if echo "$RESPONSE" | grep -Ei '"success"\s*:\s*true' > /dev/null; then
            echo "✅ KV 同步成功！"
          else
            echo "❌ KV 同步失败，请检查 Token 权限或 ID 是否正确。"
            exit 1
          fi
      # ================== 域名同步模块结束 ==================

      - name: 5. 哨兵监听 (纯净 API 路径版)
        env:
          MY_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          ROOT_DIR=$(pwd)
          DATA_DIR="$ROOT_DIR/sub-store-nodes"
          SUBS_DIR="$ROOT_DIR/subs"
          REPO_DIR="$ROOT_DIR/target_repo"
          mkdir -p "$SUBS_DIR" "$DATA_DIR"

          # 1. 核心同步函数：直接访问 3000 端口提取订阅
          do_sync_push() {
            echo "📥 正在从后端提取节点数据..."
            # 这里的 SUB_LIST 建议在 vars 里配置，或者直接写在这里
            local_list="sub:yaml|txt|json
            yml:yaml|txt|json
            zh:json"
            readarray -t LINES <<< "$(echo "$local_list" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            
            rm -rf "$REPO_DIR"
            git clone --depth 1 https://x-access-token:${MY_TOKEN}@github.com/aa2283/v2ray_configs.git "$REPO_DIR"
            
            for line in "${LINES[@]}"; do
              [ -z "$line" ] && continue
              NAME=$(echo $line | cut -d: -f1)
              FMTS=$(echo $line | cut -d: -f2 | tr '|' ' ')
              for fmt in $FMTS; do
                echo "抓取: $NAME ($fmt)"
                # 标准路径下载：不带任何混淆前缀
                curl -s --fail "http://127.0.0.1:3000/download/$NAME?target=$fmt" -o "$SUBS_DIR/$NAME.$fmt" || echo "⚠️ 失败: $NAME"
              done
            done
            
            # 物理覆盖回仓库
            cp -f "$DATA_DIR/sub-store.json" "$REPO_DIR/sub-store-nodes/sub-store.json"
            cp -f "$SUBS_DIR"/* "$REPO_DIR/sub-store-nodes/" 2>/dev/null || true
            
            cd "$REPO_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            if ! git diff --cached --quiet; then
              git commit -m "Automated Sync: $(date +'%Y-%m-%d %H:%M')"
              git push origin main && echo "🚀 仓库同步已完成"
            fi
            cd "$ROOT_DIR"
          }

          # 2. 哨兵循环监测
          for i in {1..15}; do
            echo ">>> 第 $i 次巡检 <<<"
            
            # 检查内部对齐路径 /opt/app/data
            JSON_CONTENT=$(docker exec substore-svc cat /opt/app/data/sub-store.json 2>/dev/null || echo "")
            SUB_COUNT=$(echo "$JSON_CONTENT" | jq '.subscribes | length' 2>/dev/null || echo "0")
            
            if [ "$SUB_COUNT" -gt 0 ]; then
                echo "✅ 后端已成功加载配置 (订阅数: $SUB_COUNT)"
                echo "$JSON_CONTENT" > "$DATA_DIR/sub-store.json"
                do_sync_push
                echo "💤 本轮任务完成，等待下次巡检..."
                sleep 60
            else
                echo "🚨 发现后端数据未加载，执行『API 强灌 + 深度激活』流程..."
                git clone --depth 1 https://x-access-token:${MY_TOKEN}@github.com/aa2283/v2ray_configs.git backup_tmp
                cp -f backup_tmp/sub-store-nodes/sub-store.json "$ROOT_DIR/snapshot.json"
                rm -rf backup_tmp

                if [ -s "$ROOT_DIR/snapshot.json" ]; then
                   # 1. 物理备份（双保险）
                   cat "$ROOT_DIR/snapshot.json" | docker exec -i substore-svc sh -c "cat > /opt/app/data/sub-store.json"
                   
                   # 2. 【核心】直接调用 API 导入 JSON 数据包
                   # 很多时候 API 导入比读取磁盘文件更有效，因为它直接操作内存
                   echo "📤 正在向 API 端口推送 331KB 核心数据..."
                   curl -s -X POST "http://127.0.0.1:3000/api/utils/import" \
                        -H "Content-Type: application/json" \
                        --data-binary @"$ROOT_DIR/snapshot.json" || echo "⚠️ API 导入请求失败"
                   
                   # 3. 深度激活：模拟多个关键路径访问
                   echo "🔌 触发后端多维激活..."
                   curl -s "http://127.0.0.1:3000/api/subscribes" > /dev/null
                   curl -s "http://127.0.0.1:3000/api/configs" > /dev/null
                   
                   # 4. 强制执行同步指令
                   curl -s -X POST "http://127.0.0.1:3000/api/utils/sync" > /dev/null || true
                   
                   echo "✨ 强灌与激活完成，等待后端内存沉淀..."
                   sleep 30
                fi
            fi
          done
