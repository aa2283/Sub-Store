name: Sub-Store 终极自动化同步 API_URL 最终

on:
  workflow_dispatch: # 保留手动启动按钮，方便随时调试
  schedule:
    # 这里的 cron 表达式：分钟 小时 日 月 周 (UTC 时间)
    # 北京时间 08:00 = UTC 00:00
    # - cron: '0 0 * * *'
    
    # 如果你想每 6 小时自动开机加工一次（北京时间 00:00, 06:00, 12:00, 18:00）
     - cron: '0 */6 * * *'

# ... 后面接你之前的 jobs 部分 ...

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0

      - name: 2. 启动服务 (挂载持久化配置)
        run: |
          mkdir -p sub-store-data
          docker run -d --name substore-svc \
            -v $(pwd)/sub-store-data:/opt/app/data \
            -p 3000:3000 -p 3001:3001 xream/sub-store
          sleep 15

      - name: 3. 开启隧道并【彻底静默】提取链接
        run: |
          # 1. 下载 cloudflared
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          # 2. 启动隧道：将所有输出 (stdout & stderr) 全部重定向到 backend.log
          # 使用 > backend.log 2>&1 确保控制台没有任何 cloudflared 的原始输出
          nohup ./cloudflared tunnel --url http://127.0.0.1:3000 --logfile backend.log > /dev/null 2>&1 &
          
          echo "🔄 正在申请私密隧道域名..."
          
          # 3. 循环提取域名
          API_URL=""
          for i in {1..20}; do
            # 从本地日志文件中精准抓取
            API_URL=$(grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' backend.log | tail -n 1)
            if [ -n "$API_URL" ]; then
              # ✨ 第一时间打码，后续任何步骤 echo 都会变成 ***
              echo "::add-mask::$API_URL"
              break
            fi
            sleep 2
          done

          if [ -z "$API_URL" ]; then 
            echo "❌ 隧道启动失败，请检查 backend.log"
            exit 1 
          fi
          
          # 4. 存入环境变量
          echo "FINAL_API_URL=$API_URL" >> $GITHUB_ENV
          
          # 5. 打印一条安全的确认信息
          echo "✅ 隧道已建立，域名已在日志中自动脱敏。"
          
          # ================== 域名同步模块开始 (建议插入在监听循环之前) ==================
          
      - name: 5. 动态域名同步至私有库 (API 修复版)
        env:
          MY_TOKEN: ${{ secrets.MY_PAT }}
          REPO: "aa2283/v2ray_configs"
          FILE: "tunnel_url.txt"
          # 确保上一阶段已经设置了 FINAL_API_URL 环境变量
        run: |
          set +x  # 静默模式
          
          echo "🔄 正在尝试通过 GitHub API 更新文件..."

          # 1. 更加健壮的 SHA 获取方式 (增加对 404 情况的处理)
          # 注意：改用 Bearer 鉴权
          SHA_RESPONSE=$(curl -s -H "Authorization: Bearer $MY_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/contents/$FILE")
          
          SHA=$(echo "$SHA_RESPONSE" | grep -o '"sha": "[^"]*' | cut -d'"' -f4 || echo "")
          
          if [ -n "$SHA" ]; then
            echo "🔍 发现现有文件，SHA: $SHA"
          else
            echo "🔍 文件不存在，将创建新文件。"
          fi

          # 2. 准备内容 (直接使用 ${{ env.FINAL_API_URL }} 可能会因为空格报错，建议加双引号)
          DATA_CONTENT=$(echo -n "${{ env.FINAL_API_URL }}" | base64 | tr -d '\n')

          # 3. 执行 PUT 更新/创建
          # 增加 Accept 头部是 API 调用的最佳实践
          RESPONSE=$(curl -s -X PUT \
            -H "Authorization: Bearer $MY_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d "{\"message\":\"Update Tunnel URL\",\"content\":\"$DATA_CONTENT\",\"sha\":\"$SHA\"}" \
            -w "\n%{http_code}" \
            "https://api.github.com/repos/$REPO/contents/$FILE")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
            echo "✅ 域名已同步至私有库 ($HTTP_CODE)。"
          else
            echo "❌ 同步失败，错误码: $HTTP_CODE"
            # 此时打印部分响应内容（不含敏感词）以便排查
            echo "错误响应详情: $(echo "$RESPONSE" | head -n 1)"
            exit 1
          fi
      # ================== 域名同步模块结束 ==================
          
      - name: 4. 精准监听下载链接并实时推送
        env:
          MY_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          for i in {1..15}
          do
            echo ">>> 第 $i 次检查 (监听 sub 订阅)..."
            
            # 1. 强制激活后端 API 状态
            timeout 60s bash -c 'until curl -s http://127.0.0.1:3000 > /dev/null; do sleep 2; done'
            curl -s -o /dev/null "https://sub-store.vercel.app/?api=http://127.0.0.1:3000"
            sleep 2
            
            # 2. 抓取两个目标格式到临时文件
            # 如果你的订阅名不叫 sub，请把下面 URL 里的 sub 改掉
            curl -s "http://127.0.0.1:3000/download/sub?target=ClashMeta" -o subs/new_clash.yaml
            curl -s "http://127.0.0.1:3000/download/sub?target=URI" -o subs/new_uri.txt
            
            # 3. 校验数据有效性 (防止抓到报错网页)
            if grep -q "proxies" subs/new_clash.yaml || grep -q "://" subs/new_uri.txt; then
              
              # 4. 对比是否有变动 (只要其中一个变了就推送)
              if [ ! -f "subs/all.yaml" ] || ! cmp -s "subs/new_clash.yaml" "subs/all.yaml" || ! cmp -s "subs/new_uri.txt" "subs/all.txt"; then
                echo "📢 检测到订阅内容更新，正在执行同步..."
                
                cp subs/new_clash.yaml subs/all.yaml
                cp subs/new_uri.txt subs/all.txt
                
                # 备份 sub-store.json
                docker cp substore-svc:/opt/app/data/sub-store.json ./sub-store-data/sub-store.json
                
                # A. 同步到当前 Sub-Store 仓库
                git config --local user.email "actions@github.com"
                git config --local user.name "GitHub Action"
                git add .
                git commit -m "自动存档: $(date +'%H:%M:%S')" || echo ""
                git push origin main
                
                # B. 同步到 v2ray_configs 仓库
                rm -rf target_repo
                if git clone https://${MY_TOKEN}@github.com/aa2283/v2ray_configs.git target_repo; then
                  mkdir -p target_repo/subs
                  cp -f subs/all.yaml target_repo/subs/all.yaml
                  cp -f subs/all.txt target_repo/subs/all.txt
                  
                  cd target_repo
                  git config --local user.email "actions@github.com"
                  git config --local user.name "GitHub Action"
                  git add .
                  git commit -m "实时更新: $(date +'%H:%M:%S')" || echo ""
                  git push origin main
                  cd ..
                  echo "🚀 v2ray_configs 同步完成！"
                fi
              else
                echo "😴 内容暂无变动。"
              fi
            else
              echo "⚠️ 尚未抓取到有效节点，请确保网页端订阅名正确且已点击[保存]。"
            fi
            
            sleep 60
          done
