name: Sub-Store 终极自动化同步 API_URL 最终1

on:
  workflow_dispatch: # 保留手动启动按钮，方便随时调试
  schedule:
    # 这里的 cron 表达式：分钟 小时 日 月 周 (UTC 时间)
    # 北京时间 08:00 = UTC 00:00
    # - cron: '0 0 * * *'
    
    # 如果你想每 6 小时自动开机加工一次（北京时间 00:00, 06:00, 12:00, 18:00）
     - cron: '0 */6 * * *'

# ... 后面接你之前的 jobs 部分 ...

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0

      - name: 2. 启动服务 (挂载持久化配置)
        run: |
          mkdir -p sub-store-data
          docker run -d --name substore-svc \
            -v $(pwd)/sub-store-data:/opt/app/data \
            -p 3000:3000 -p 3001:3001 xream/sub-store
          sleep 15

      - name: 3. 开启隧道并提取链接
        run: |
          # 1. 下载并准备
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          # 2. 启动隧道：去掉 --logfile，改用标准重定向
          # 这样 cloudflared 的所有实时输出都会进入 backend.log
          nohup ./cloudflared tunnel --url http://127.0.0.1:3000 > backend.log 2>&1 &
          
          echo "🔄 正在申请隧道域名 (预计 10-30 秒)..."
          
          # 3. 循环提取域名
          API_URL=""
          for i in {1..15}; do
            # 兼容更多字符情况的正则
            API_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' backend.log | head -n 1)
            if [ -n "$API_URL" ]; then
              echo "✅ 成功获取域名！"
              echo "::add-mask::$API_URL"
              break
            fi
            echo "等待中 ($i/15)..."
            sleep 3
          done

          # 4. 失败处理：如果没提取到，打印日志内容用于排查
          if [ -z "$API_URL" ]; then 
            echo "❌ 提取链接失败！以下是 backend.log 的最后内容："
            tail -n 20 backend.log
            exit 1 
          fi
          
          # 5. 存入环境变量
          echo "FINAL_API_URL=$API_URL" >> $GITHUB_ENV
          
          # ================== 域名同步模块开始 (建议插入在监听循环之前) ==================
          
      - name: 4. 域名同步至 Cloudflare KV
        env:
          KV_KEY: "URL_3000" 
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "${{ env.FINAL_API_URL }}" ]; then
            echo "❌ FINAL_API_URL 为空，跳过同步"
            exit 1
          fi

          echo "🚀 正在同步域名到 Cloudflare KV, Key: ${{ env.KV_KEY }}"
          
          # 执行 PUT 请求
          RESPONSE=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_ID/values/${{ env.KV_KEY }}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: text/plain" \
            --data "${{ env.FINAL_API_URL }}")

          # 【关键修复】使用正则兼容有无空格的情况，并打印原始响应方便排查
          echo "📡 原始响应: $RESPONSE"
          
          if echo "$RESPONSE" | grep -Ei '"success"\s*:\s*true' > /dev/null; then
            echo "✅ KV 同步成功！"
          else
            echo "❌ KV 同步失败，请检查 Token 权限或 ID 是否正确。"
            exit 1
          fi
      # ================== 域名同步模块结束 ==================
          
      - name: 5. 精准监听下载链接并实时推送
        env:
          MY_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          for i in {1..15}
          do
            echo ">>> 第 $i 次检查 (监听 sub 订阅)..."
            
            # 1. 强制激活后端 API 状态
            timeout 60s bash -c 'until curl -s http://127.0.0.1:3000 > /dev/null; do sleep 2; done'
            curl -s -o /dev/null "https://sub-store.vercel.app/?api=http://127.0.0.1:3000"
            sleep 2
            
            # 2. 抓取两个目标格式到临时文件
            # 如果你的订阅名不叫 sub，请把下面 URL 里的 sub 改掉
            curl -s "http://127.0.0.1:3000/download/sub?target=ClashMeta" -o subs/new_clash.yaml
            curl -s "http://127.0.0.1:3000/download/sub?target=URI" -o subs/new_uri.txt
            
            # 3. 校验数据有效性 (防止抓到报错网页)
            if grep -q "proxies" subs/new_clash.yaml || grep -q "://" subs/new_uri.txt; then
              
              # 4. 对比是否有变动 (只要其中一个变了就推送)
              if [ ! -f "subs/all.yaml" ] || ! cmp -s "subs/new_clash.yaml" "subs/all.yaml" || ! cmp -s "subs/new_uri.txt" "subs/all.txt"; then
                echo "📢 检测到订阅内容更新，正在执行同步..."
                
                cp subs/new_clash.yaml subs/all.yaml
                cp subs/new_uri.txt subs/all.txt
                
                # 备份 sub-store.json
                docker cp substore-svc:/opt/app/data/sub-store.json ./sub-store-data/sub-store.json
                
                # A. 同步到当前 Sub-Store 仓库
                #git config --local user.email "actions@github.com"
                #git config --local user.name "GitHub Action"
                #git add .
                #git commit -m "自动存档: $(date +'%H:%M:%S')" || echo ""
                #git push origin main
                
                # B. 同步到 v2ray_configs 仓库
                rm -rf target_repo
                # 使用你的 MY_PAT 进行克隆
                if git clone https://${MY_TOKEN}@github.com/aa2283/v2ray_configs.git target_repo; then
                  # 1. 创建英文目录（稳妥）
                  mkdir -p target_repo/sub-store-nodes
                  
                  # 2. 直接使用你想要的文件名
                  cp -f subs/all.yaml target_repo/sub-store-nodes/sub-store.yaml
                  cp -f subs/all.txt target_repo/sub-store-nodes/sub-store.txt
                  
                  # 3. 【核心步骤】必须进入克隆下来的仓库目录
                  cd target_repo
                  
                  git config --local user.email "actions@github.com"
                  git config --local user.name "GitHub Action"
                  
                  # 4. 执行 Git 提交
                  git add .
                  # 检查是否有内容变化，防止空提交报错
                  if [ -n "$(git status --porcelain)" ]; then
                    git commit -m "实时更新: $(date +'%H:%M:%S')"
                    
                    # 5. 拉取并推送（私有仓库也需要 rebase 以防万一）
                    git pull --rebase origin main
                    git push origin main
                    echo "🚀 v2ray_configs 同步完成！"
                  else
                    echo "ℹ️ 内容无变动，跳过推送"
                  fi
                  
                  # 6. 回到上级目录并清理
                  cd ..
                  rm -rf target_repo
                else
                  echo "❌ 克隆失败，请检查 MY_PAT 权限"
                fi
            
            sleep 60
          done
