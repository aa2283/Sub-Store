name: Sub-Store 终极自动化同步 API_URL 最终1

on:
  workflow_dispatch: # 保留手动启动按钮，方便随时调试
  schedule:
    # 这里的 cron 表达式：分钟 小时 日 月 周 (UTC 时间)
    # 北京时间 08:00 = UTC 00:00
    # - cron: '0 0 * * *'
    
    # 如果你想每 6 小时自动开机加工一次（北京时间 00:00, 06:00, 12:00, 18:00）
     - cron: '0 */6 * * *'

# ... 后面接你之前的 jobs 部分 ...

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0
          
      - name: 1-2. 载入备份
        run: |
          # 创建配置目录
          mkdir -p data
          
          # 尝试从你的私有仓库拉取现有的配置
          echo "📥 正在拉取 sub-store.json 备份..."
          rm -rf backup_repo
          if git clone https://x-access-token:${MY_TOKEN}@github.com/aa2283/v2ray_configs.git backup_repo; then
              if [ -f "backup_repo/sub-store-nodes/sub-store.json" ]; then
                  cp -f backup_repo/sub-store-nodes/sub-store.json data/sub-store.json
                  echo "✅ 已恢复之前的 Sub-Store 配置"
              else
                  echo "ℹ️ 仓库中未找到备份，将以初始状态启动"
              fi
              rm -rf backup_repo
          fi

          # 启动 Sub-Store 容器
          #docker run -d --name sub-store -v $(pwd)/data:/opt/sub-store/data -p 3000:3000 xream/sub-store
          
          # 等待启动...
          sleep 10

      - name: 2. 启动服务 (挂载持久化配置)
        run: |
          mkdir -p sub-store-data
          docker run -d --name substore-svc \
            -v $(pwd)/sub-store-data:/opt/app/data \
            -p 3000:3000 -p 3001:3001 xream/sub-store
          sleep 15

      - name: 3. 开启隧道并提取链接
        run: |
          # 1. 下载并准备
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          # 2. 启动隧道：去掉 --logfile，改用标准重定向
          # 这样 cloudflared 的所有实时输出都会进入 backend.log
          nohup ./cloudflared tunnel --url http://127.0.0.1:3000 > backend.log 2>&1 &
          
          echo "🔄 正在申请隧道域名 (预计 10-30 秒)..."
          
          # 3. 循环提取域名
          API_URL=""
          for i in {1..15}; do
            # 兼容更多字符情况的正则
            API_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' backend.log | head -n 1)
            if [ -n "$API_URL" ]; then
              echo "✅ 成功获取域名！"
              echo "::add-mask::$API_URL"
              break
            fi
            echo "等待中 ($i/15)..."
            sleep 3
          done

          # 4. 失败处理：如果没提取到，打印日志内容用于排查
          if [ -z "$API_URL" ]; then 
            echo "❌ 提取链接失败！以下是 backend.log 的最后内容："
            tail -n 20 backend.log
            exit 1 
          fi
          
          # 5. 存入环境变量
          echo "FINAL_API_URL=$API_URL" >> $GITHUB_ENV
          
          # ================== 域名同步模块开始 (建议插入在监听循环之前) ==================
          
      - name: 4. 域名同步至 Cloudflare KV
        env:
          KV_KEY: "URL_3000" 
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "${{ env.FINAL_API_URL }}" ]; then
            echo "❌ FINAL_API_URL 为空，跳过同步"
            exit 1
          fi

          echo "🚀 正在同步域名到 Cloudflare KV, Key: ${{ env.KV_KEY }}"
          
          # 执行 PUT 请求
          RESPONSE=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_ID/values/${{ env.KV_KEY }}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: text/plain" \
            --data "${{ env.FINAL_API_URL }}")

          # 【关键修复】使用正则兼容有无空格的情况，并打印原始响应方便排查
          echo "📡 原始响应: $RESPONSE"
          
          if echo "$RESPONSE" | grep -Ei '"success"\s*:\s*true' > /dev/null; then
            echo "✅ KV 同步成功！"
          else
            echo "❌ KV 同步失败，请检查 Token 权限或 ID 是否正确。"
            exit 1
          fi
      # ================== 域名同步模块结束 ==================
          
      - name: 5. 精准监听下载链接并实时推送
        env:
          MY_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          mkdir -p subs
          local_list="${{ vars.SUB_LIST }}"
          if [ -z "$local_list" ]; then echo "❌ 缺失 SUB_LIST"; exit 1; fi
          readarray -t LINES <<< "$local_list"

          for i in {1..15}
          do
            echo ">>> 第 $i 次检查 <<<"
            HAS_UPDATE=false
            
            for line in "${LINES[@]}"; do
              [[ -z "$line" ]] && continue
              NAME="${line%%:*}"
              FORMATS_STR="${line#*:}"
              IFS='|' read -ra FORMATS <<< "$FORMATS_STR"
              
              for fmt in "${FORMATS[@]}"; do
                case $fmt in
                  yaml) TARGET="ClashMeta" ;;
                  json) TARGET="sing-box" ;;
                  txt)  TARGET="URI" ;;
                  *)    TARGET="$fmt" ;;
                esac
                
                ext=$fmt
                FILE_PATH="subs/$NAME.$ext"
                OLD_PATH="subs/old_$NAME.$ext"
                
                curl -s "http://127.0.0.1:3000/download/$NAME?target=$TARGET" -o "$FILE_PATH"
                
                if [ -s "$FILE_PATH" ]; then
                  if [ ! -f "$OLD_PATH" ] || ! cmp -s "$FILE_PATH" "$OLD_PATH" || [ "$i" -eq 1 ]; then
                    echo "📢 变动检测: $NAME.$ext"
                    cp -f "$FILE_PATH" "$OLD_PATH"
                    HAS_UPDATE=true
                  fi
                fi
              done
            done

            if [ "$HAS_UPDATE" = true ]; then
                echo "🚀 启动仓库同步..."
                rm -rf target_repo
                # 1. 克隆仓库
                if git clone https://x-access-token:${MY_TOKEN}@github.com/aa2283/v2ray_configs.git target_repo; then
                    # 2. 确保目标目录存在
                    DEST="target_repo/sub-store-nodes"
                    mkdir -p "$DEST"
                    
                    # 3. 备份现有的 json 配置（如果存在），防止被误删
                    [ -f "$DEST/sub-store.json" ] && cp "$DEST/sub-store.json" ./temp_sub_store.json
                    
                    # 4. 清理旧订阅文件并放入新文件
                    rm -rf "$DEST"/*
                    cp -f subs/[!old]*.* "$DEST/" 2>/dev/null || true
                    
                    # 5. 优先从运行中的 data 目录同步最新的 json 配置，如果没有，则还原刚才备份的
                    if [ -f "sub-store-data/sub-store.json" ]; then
                        cp -f sub-store-data/sub-store.json "$DEST/sub-store.json"
                        echo "✅ 配置已从运行目录备份"
                    elif [ -f "./temp_sub_store.json" ]; then
                        mv ./temp_sub_store.json "$DEST/sub-store.json"
                        echo "⚠️ 运行目录无配置，已保留仓库原有配置"
                    fi
                    
                    # 6. 提交变动
                    cd target_repo
                    git config --local user.email "actions@github.com"
                    git config --local user.name "GitHub Action"
                    git add .
                    
                    # 只有在真的有变动时才 push
                    if [ -n "$(git status --porcelain)" ]; then
                        git commit -m "自动同步 [$(date +'%H:%M')]"
                        git push origin main
                        echo "🚀 同步成功！"
                    else
                        echo "ℹ️ 文件内容无实质变化，跳过推送"
                    fi
                    cd ..
                    rm -rf target_repo
                    rm -f ./temp_sub_store.json
                else
                    echo "❌ 克隆失败"
                fi
            else
                echo ">>> 暂无变动"
            fi
            sleep 60
          done
